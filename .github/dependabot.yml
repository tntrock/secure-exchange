version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go-deps: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      # their majors are peer-coupled: each fails CI alone
      i18n: {patterns: [i18next, react-i18next]}
      web-deps: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /e2e
    schedule: {interval: weekly}
    groups:
      e2e-deps: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    ignore:
      # Node: even-numbered (LTS) majors only
      - dependency-name: node
        versions: [">= 25, < 26", ">= 27, < 28", ">= 29, < 30"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
