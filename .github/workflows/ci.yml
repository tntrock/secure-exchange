name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no token secret
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sx
          POSTGRES_PASSWORD: sx
          POSTGRES_DB: sx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sx" --health-interval 5s --health-retries 10
    env:
      SX_TEST_DATABASE_URL: postgres://sx:sx@localhost:5432/sx?sslmode=disable
      SX_TEST_S3_ENDPOINT: localhost:59000
      SX_TEST_SMTP_ADDR: localhost:51025
    steps:
      - uses: actions/checkout@v7
      # A service container cannot take a command, so run minio by hand.
      - name: Start minio
        run: |
          docker run -d --name minio -p 59000:9000 \
            -e MINIO_ROOT_USER=sxminio -e MINIO_ROOT_PASSWORD=sxminio123 \
            cgr.dev/chainguard/minio server /data
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS http://localhost:59000/minio/health/ready
      - name: Start mailpit
        run: |
          docker run -d --name mailpit -p 51025:1025 -p 58025:8025 axllent/mailpit:v1.32
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS http://localhost:58025/livez
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web tests and build
        working-directory: web
        run: npm ci && npx vitest run --coverage && npm run build
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with: {name: cov-test, path: coverage.out}
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage.out,./web/coverage/lcov.info
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags tools

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  # //go:build tools tests (LibreOffice/poppler/ffmpeg) inside the worker-test image.
  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sx
          POSTGRES_PASSWORD: sx
          POSTGRES_DB: sx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sx" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Start minio
        run: |
          docker run -d --name minio -p 59000:9000 \
            -e MINIO_ROOT_USER=sxminio -e MINIO_ROOT_PASSWORD=sxminio123 \
            cgr.dev/chainguard/minio server /data
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS http://localhost:59000/minio/health/ready
      - run: docker build --target worker-test -t sx-worker-test .
      - name: Tools tests
        run: |
          docker run --rm --network host --tmpfs /work -v "$PWD:/src" \
            -e SX_TEST_DATABASE_URL=postgres://sx:sx@localhost:5432/sx?sslmode=disable \
            -e SX_TEST_S3_ENDPOINT=localhost:59000 \
            sx-worker-test
      - name: Upload tools coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage-tools.out
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        with: {name: cov-tools, path: coverage-tools.out}

  # Hard 90% gate on the merged Go profiles (web enforces its own via vitest thresholds).
  coverage:
    needs: [test, tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {pattern: cov-*, merge-multiple: true}
      - run: sh scripts/covergate.sh coverage.out coverage-tools.out
