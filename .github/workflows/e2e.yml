name: e2e
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # ClamAV signatures (~300 MB): cached per ISO week (an earlier week is the fallback) so freshclam
      # only fetches the delta; saved even when the run fails, since the download is the slow part.
      - id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: clamav
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .e2e-clamav
          key: clamav-${{ runner.os }}-${{ steps.week.outputs.w }}
          restore-keys: clamav-${{ runner.os }}-
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npm run typecheck && npx playwright install --with-deps chromium
      - name: Browser e2e
        run: scripts/e2e.sh
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always() && steps.clamav.outputs.cache-hit != 'true'
        with:
          path: .e2e-clamav
          key: clamav-${{ runner.os }}-${{ steps.week.outputs.w }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
