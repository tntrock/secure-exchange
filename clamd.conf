# clamd for secure-exchange. Based on the clamav/clamav:1.4 image's own file.
LogFile /var/log/clamav/clamd.log
LogTime yes
Foreground yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
TemporaryDirectory /tmp

# StreamMaxLength, MaxFileSize and the /tmp tmpfs (docker-compose.yml) must all stay >= SX_SCAN_MAX_BYTES
# (default 1 GiB = 1024M; 1100M leaves headroom). Raise them together with it.
StreamMaxLength 1100M
MaxFileSize 1100M
MaxScanSize 4000M

# Reload signatures one at a time: a concurrent reload keeps two copies of the database in memory,
# which does not fit under the container's mem_limit.
ConcurrentDatabaseReload no

# Scan-time, size and archive limits (MaxScanTime, MaxScanSize, MaxFileSize, MaxRecursion, ...) stop a
# scan early and still report OK (AlertExceedsMax is no), so "clean" means "no virus found within
# ClamAV's limits", not "proven clean".
