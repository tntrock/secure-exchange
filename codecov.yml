coverage:
  status:
    project:
      default: {target: auto, threshold: 1%, informational: true}
    patch:
      default: {informational: true}
comment:
  layout: "condensed_header, diff, flags"
ignore:
  - "web/src/**/*.test.tsx"
  - "web/src/**/*.test.ts"
  - "internal/db/testdb/**"
  - "internal/mail/mailtest/**"
  - "**/*_windows.go"
  - "**/*_other.go"
  - "web/src/main.tsx"
