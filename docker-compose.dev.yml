name: secure-exchange-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sx
      POSTGRES_PASSWORD: sx
      POSTGRES_DB: sx
    ports:
      - "55432:5432"
  minio:
    image: cgr.dev/chainguard/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: sxminio
      MINIO_ROOT_PASSWORD: sxminio123
    ports:
      - "59000:9000"
  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "51025:1025"
      - "58025:8025"
  # ClamAV for the scan worker: docker compose -f docker-compose.dev.yml --profile scan up -d clamav
  # (first start downloads signatures, several minutes). SX_TEST_CLAMD_ADDR=localhost:53310
  clamav:
    image: clamav/clamav:1.4
    profiles: [scan]
    volumes:
      - clamdb:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    tmpfs:
      - /tmp:size=1200m,mode=1777
    ports:
      - "53310:3310"
  # tools tests (soffice/poppler) against the dev postgres:
  #   docker compose -f docker-compose.dev.yml --profile tools run --rm worker-test
  worker-test:
    build: {context: ., target: worker-test}
    profiles: [tools]
    depends_on: [postgres, minio]
    volumes: [".:/src", "gomodcache:/root/go/pkg/mod"]
    tmpfs: /work
    environment:
      SX_TEST_DATABASE_URL: postgres://sx:sx@postgres:5432/sx?sslmode=disable
      SX_TEST_S3_ENDPOINT: minio:9000

volumes:
  gomodcache:
  clamdb:
