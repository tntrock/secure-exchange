services:
  app:
    image: ghcr.io/tntrock/secure-exchange:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      SX_BASE_URL: ${SX_BASE_URL:-https://${SX_DOMAIN:?set SX_DOMAIN in .env}}
      SX_DATABASE_URL: postgres://sx:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sx?sslmode=disable
      SX_TRUSTED_PROXIES: 172.30.0.0/24 # the sx network below (Caddy's source address)
      GOMEMLIMIT: 3584MiB # soft GC target below mem_limit (4g) so the Go heap collects before the OOM killer
      # Download trace marks (defaults shown; see README):
      #SX_MARK_MAX_BYTES: 268435456
      #SX_MARK_MAX_PIXELS: 50000000
      #SX_UNMARKABLE_POLICY: warn # warn or block
    volumes:
      - sxdata:/data
      - ./certs:/etc/secure-exchange/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Marked downloads build up to 2 files in memory (image: ~1.5 GiB each at the default limits):
    # 2 x 1.5 GiB + 512 MiB headroom, rounded up. No swap.
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 512
    networks: [sx, backend]

  # Renders previews of untrusted files (LibreOffice/poppler/ffmpeg). Locked down: no outbound
  # network (backend is internal), read-only root, plaintext only on the /work tmpfs.
  worker:
    image: ghcr.io/tntrock/secure-exchange-worker:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      SX_BASE_URL: ${SX_BASE_URL:-https://${SX_DOMAIN:?set SX_DOMAIN in .env}}
      SX_DATABASE_URL: postgres://sx:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sx?sslmode=disable
    read_only: true
    tmpfs:
      - /work:size=4g,mode=0700,uid=65532,gid=65532
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # /work tmpfs pages count against mem_limit: keep largest preview input + output <= 4g < mem_limit
    mem_limit: 6g
    memswap_limit: 6g # = mem_limit: no swap, decrypted tmpfs pages never reach disk
    cpus: 2
    pids_limit: 512
    volumes:
      - sxdata:/data # local blob store (SX_STORAGE=local)
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    # backend and scan only. With external S3, also attach a network that can reach it (see README).
    networks: [backend, scan]

  # Virus scanner for external uploads. Needs the internet for signature updates (freshclam),
  # so it sits on its own egress network, never on sx (whose subnet is a trusted proxy range).
  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    tmpfs:
      - /tmp:size=1200m,mode=1777 # clamd spools INSTREAM data here: scanned plaintext stays in RAM
    mem_limit: 4g
    memswap_limit: 4g
    networks: [scan, updates] # not on backend: only the worker can reach clamd

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sx -d sx"]
      interval: 5s
      retries: 10
    networks: [backend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${SX_HTTP_PORT:-80}:80"
      - "${SX_HTTPS_PORT:-443}:443"
    environment:
      SX_DOMAIN: ${SX_DOMAIN:?set SX_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
    networks: [sx]

volumes:
  pgdata:
  sxdata:
  caddydata:
  clamdb:

networks:
  sx:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  updates: {}
  scan:
    internal: true # worker <-> clamd only; clamav sits off backend (no route to postgres)
  backend:
    internal: true # no route out: the worker cannot reach the internet
