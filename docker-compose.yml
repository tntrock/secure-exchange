services:
  app:
    build: {context: ., target: app}
    restart: unless-stopped
    env_file: .env
    environment:
      SX_BASE_URL: https://${SX_DOMAIN:?set SX_DOMAIN in .env}
      SX_DATABASE_URL: postgres://sx:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sx?sslmode=disable
      SX_TRUSTED_PROXIES: 172.30.0.0/24 # the sx network below (Caddy's source address)
      # Download trace marks (defaults shown; see README):
      #SX_MARK_MAX_BYTES: 268435456
      #SX_MARK_MAX_PIXELS: 50000000
      #SX_UNMARKABLE_POLICY: warn # warn or block
    volumes:
      - sxdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sx, backend]

  # Renders previews of untrusted files (LibreOffice/poppler/ffmpeg). Locked down: no outbound
  # network (backend is internal), read-only root, plaintext only on the /work tmpfs.
  worker:
    build: {context: ., target: worker}
    restart: unless-stopped
    env_file: .env
    environment:
      SX_BASE_URL: https://${SX_DOMAIN:?set SX_DOMAIN in .env}
      SX_DATABASE_URL: postgres://sx:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sx?sslmode=disable
    read_only: true
    tmpfs:
      - /work:size=4g,mode=0700,uid=65532,gid=65532
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # /work tmpfs pages count against mem_limit: keep largest preview input + output <= 4g < mem_limit
    mem_limit: 6g
    memswap_limit: 6g # = mem_limit: no swap, decrypted tmpfs pages never reach disk
    cpus: 2
    pids_limit: 512
    volumes:
      - sxdata:/data # local blob store (SX_STORAGE=local)
    depends_on:
      postgres:
        condition: service_healthy
    # backend only. With external S3, also attach a network that can reach it (see README).
    networks: [backend]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sx -d sx"]
      interval: 5s
      retries: 10
    networks: [backend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${SX_HTTP_PORT:-80}:80"
      - "${SX_HTTPS_PORT:-443}:443"
    environment:
      SX_DOMAIN: ${SX_DOMAIN:?set SX_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
    networks: [sx]

volumes:
  pgdata:
  sxdata:
  caddydata:

networks:
  sx:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true # no route out: the worker cannot reach the internet
