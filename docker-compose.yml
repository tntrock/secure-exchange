services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SX_BASE_URL: https://${SX_DOMAIN:?set SX_DOMAIN in .env}
      SX_DATABASE_URL: postgres://sx:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sx?sslmode=disable
      SX_TRUSTED_PROXIES: 172.30.0.0/24 # the compose network below (Caddy's source address)
    volumes:
      - sxdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sx]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sx -d sx"]
      interval: 5s
      retries: 10
    networks: [sx]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${SX_HTTP_PORT:-80}:80"
      - "${SX_HTTPS_PORT:-443}:443"
    environment:
      SX_DOMAIN: ${SX_DOMAIN:?set SX_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
    networks: [sx]

volumes:
  pgdata:
  sxdata:
  caddydata:

networks:
  sx:
    ipam:
      config:
        - subnet: 172.30.0.0/24
