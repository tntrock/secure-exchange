# Dex for the OIDC e2e test (scripts/e2e.sh). The issuer must be the same URL for the browser (host,
# published port; Chromium resolves *.localhost to loopback) and the app (network alias on sx).
# TLS cert: throwaway self-signed, generated by e2e.sh into .e2e-dex/ (also the app's SX_OIDC_CA).
issuer: https://dex.localhost:59556/dex
storage:
  type: memory
web:
  https: 0.0.0.0:59556
  tlsCert: /etc/dex/tls/tls.crt
  tlsKey: /etc/dex/tls/tls.key
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: sx-e2e
    secretEnv: SX_OIDC_CLIENT_SECRET
    name: secure-exchange e2e
    redirectURIs:
      - https://localhost:59443/api/auth/oidc/callback
enablePasswordDB: true
staticPasswords:
  - email: oidc-user@e2e.test
    # bcrypt of "e2e-oidc-password" (test-only user; caddy hash-password --algorithm bcrypt)
    hash: "$2a$14$YtK9IkftlHgl7LNBNBQq/eEeWMNq.7coAZRRHhaT5CnCUkBWinN5q"
    username: oidc-user
    userID: 6f1c5a3e-0e2a-4c1b-9a59-3d1f4e2b7c10
